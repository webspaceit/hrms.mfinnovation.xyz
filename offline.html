<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Rent Management System</title>
    <meta name="theme-color" content="#007c47">
    <meta name="robots" content="noindex">
    <style>
        /* Self-contained: this page must render with no network at all. */
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #007c47 0%, #003820 100%);
            color: #ffffff;
        }
        .card {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
        p { margin: 0 0 6px; font-size: 14px; line-height: 1.55; color: rgba(255, 255, 255, 0.82); }
        .bn { margin-top: 14px; font-size: 14px; line-height: 1.7; color: rgba(255, 255, 255, 0.82); }
        button {
            margin-top: 24px;
            width: 100%;
            padding: 12px 18px;
            border: 0;
            border-radius: 10px;
            background: #ffffff;
            color: #00603a;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { transform: scale(0.99); }
        .hint { margin-top: 14px; font-size: 12px; color: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" aria-hidden="true">&#128225;</div>
        <h1>You are offline</h1>
        <p>The app needs a connection to load rent, invoice and payment data.</p>
        <div class="bn">আপনি এখন অফলাইনে আছেন। ভাড়া, ইনভয়েস ও পেমেন্ট তথ্য দেখতে ইন্টারনেট সংযোগ প্রয়োজন।</div>
        <button type="button" onclick="location.reload()">Try again / আবার চেষ্টা করুন</button>
        <div class="hint">Your data is safe — nothing was changed.</div>
    </div>
    <script>
        // Come back automatically as soon as the connection returns.
        window.addEventListener('online', function () {
            location.reload();
        });
    </script>
</body>
</html>
