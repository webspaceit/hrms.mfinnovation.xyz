<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - ভাড়া ব্যবস্থাপনা সিস্টেম</title>
    <!-- Tailwind CSS (runtime CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/oop-rms/assets/css/style.css?v=1794645765" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/oop-rms/assets/images/favicon.svg">
    <!-- PWA: installable app -->
    <meta name="theme-color" content="#007c47">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="RMS">
    <link rel="manifest" href="/oop-rms/manifest.php">
    <link rel="apple-touch-icon" sizes="180x180" href="/oop-rms/assets/icons/apple-touch-icon.png?v=1794645686">
    <link rel="icon" type="image/png" sizes="32x32" href="/oop-rms/assets/icons/favicon-32.png?v=1794645686">
    <script src="/oop-rms/assets/js/pwa.js?v=1794645757" defer></script>
</head>
<body>
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-body p-4 md:p-8">
            <div class="auth-logo">
                <i class="bi bi-buildings"></i>
                <h4 class="fw-bold mt-2">ভাড়া ব্যবস্থাপনা সিস্টেম</h4>
                <p class="text-muted">আপনার অ্যাকাউন্টে লগইন করুন</p>
            </div>

            
            <form method="POST" action="">
                <input type="hidden" name="csrf_token" value="fef250de204b9fed9b00d84d6c43d961bb2f1748d57efd61a75faf96dde181f0">                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person mr-1"></i>ইউজারনেম</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-lock mr-1"></i>পাসওয়ার্ড</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-auth-primary">
                    <i class="bi bi-box-arrow-in-right mr-1"></i> লগইন                </button>
            </form>

            <hr class="border-top my-4">

            <div class="flex justify-center gap-2">
                <a href="javascript:void(0)" onclick="setLanguage('en')" class="btn btn-sm btn-outline-secondary">ইংরেজি</a>
                <a href="javascript:void(0)" onclick="setLanguage('bn')" class="btn btn-sm btn-success">বাংলা</a>
            </div>
        </div>
    </div>
</div>

<script>
    const BASE_URL = '/oop-rms/';
    const CSRF_TOKEN = 'fef250de204b9fed9b00d84d6c43d961bb2f1748d57efd61a75faf96dde181f0';
    function setLanguage(lang) {
        fetch(BASE_URL + 'ajax/lang.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'lang=' + encodeURIComponent(lang) + '&csrf_token=' + encodeURIComponent(CSRF_TOKEN)
        }).then(res => res.json()).then(data => {
            if (!data.success) {
                console.error('Language switch failed:', data.message || data);
            }
            reloadWithLang(lang);
        }).catch(err => {
            console.error('Language switch request failed:', err);
            reloadWithLang(lang);
        });
    }
    function reloadWithLang(lang) {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
    }
</script>
</body>
</html>
